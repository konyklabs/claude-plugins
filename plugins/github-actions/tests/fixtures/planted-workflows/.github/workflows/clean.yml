name: clean

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      - name: Build
        run: echo "building"
  call:
    permissions:
      contents: read
    uses: konyklabs/.github/.github/workflows/x.yml@d23441a48e516b6c34aea4fa41551a30e30af803 # v1
