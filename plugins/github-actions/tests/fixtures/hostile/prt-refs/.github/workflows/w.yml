on:
  pull_request_target:
permissions: {}
jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
  head:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4
        with:
          ref: refs/pull/${{ github.event.number }}/head
